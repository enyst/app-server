[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minimal-openhands-app-server"
version = "0.1.0"
description = "Minimal OpenHands app_server control plane for Agent Canvas and agent-server runtimes"
readme = "README.md"
requires-python = ">=3.12"  # openhands-sdk requires 3.12+
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
  "docker>=7,<8",
  "websockets>=13,<16",
  # Source of truth for the agent-server wire format: Settings are stored as
  # SDK AgentSettings/ConversationSettings and turned into a
  # StartConversationRequest at conversation start. Keep in lockstep with the
  # agent-server image tag in config.py.
  "openhands-sdk==1.38.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.8,<1",
  # Integration tests stand up a real agent-server subprocess. Pinned in
  # lockstep with openhands-sdk and the agent-server image tag in config.py.
  # openhands-tools ships the tool implementations (e.g. libtmux) the runtime
  # imports at startup.
  "openhands-agent-server==1.38.0",
  "openhands-tools==1.38.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests that stand up a real agent-server subprocess (slow)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
